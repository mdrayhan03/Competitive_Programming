<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Theme Demo</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --wall-color: #2b2b3d;
            --desk-color: #8d5b4c;
            --shelf-color: #5c3a21;
            --accent-glow: #6c5ce7;
            --screen-light: #74b9ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Room Container */
        .room {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 60%, #3a3a52 0%, var(--wall-color) 80%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Ambient Lighting */
        .ambient-light {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(116, 185, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        /* LEFT: Book Rack / Project Files */
        .book-rack {
            position: absolute;
            left: 5%;
            top: 20%;
            width: 180px;
            height: 400px;
            background-color: var(--shelf-color);
            border: 4px solid #3d2514;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px;
            border-radius: 4px;
        }

        .shelf {
            height: 20%;
            border-bottom: 8px solid #3d2514;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            padding-bottom: 2px;
        }

        .file-binder {
            width: 25px;
            border-radius: 3px 3px 0 0;
            font-size: 10px;
            text-align: center;
            color: #fff;
            writing-mode: vertical-rl;
            padding: 4px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .file-binder:hover {
            transform: translateY(-5px);
        }

        .file-1 { height: 80%; background-color: #e74c3c; }
        .file-2 { height: 90%; background-color: #3498db; }
        .file-3 { height: 85%; background-color: #2ecc71; }
        .file-4 { height: 75%; background-color: #f1c40f; }

        /* RIGHT: Achievement Rack */
        .achievement-rack {
            position: absolute;
            right: 5%;
            top: 20%;
            width: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .rack-title {
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f1c40f;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }

        .medals-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }

        .medal {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: relative;
        }

        .medal::before {
            content: '';
            position: absolute;
            top: -12px;
            width: 10px;
            height: 12px;
            background: #e74c3c;
        }

        .gold { background: linear-gradient(45deg, #f1c40f, #f39c12); }
        .silver { background: linear-gradient(45deg, #bdc3c7, #95a5a6); }
        .bronze { background: linear-gradient(45deg, #e67e22, #d35400); }

        .trophy-shelf {
            border-top: 4px solid #5c3a21;
            padding-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .trophy {
            font-size: 28px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* CENTER: Desk Workstation Area */
        .workspace {
            position: relative;
            width: 700px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* The Desk Surface */
        .desk {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background-color: var(--desk-color);
            border-top: 10px solid #a06856;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 2;
        }

        /* Devices Setup on Desk */
        .devices-setup {
            position: absolute;
            bottom: 100px; /* Sitting right on top of the desk */
            width: 90%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            z-index: 3;
        }

        /* Monitor (Left of Laptop) */
        .monitor {
            width: 180px;
            height: 120px;
            background-color: #000;
            border: 4px solid #333;
            border-radius: 6px;
            box-shadow: 0 0 15px var(--screen-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .monitor-stand {
            position: absolute;
            bottom: -15px;
            width: 30px;
            height: 15px;
            background-color: #555;
        }

        /* Laptop (Center Face-Away) */
        .laptop {
            width: 160px;
            height: 100px;
            background-color: #111;
            border: 3px solid #444;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 0 20px rgba(116, 185, 255, 0.4);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .laptop-logo {
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
        }

        .screen-glow {
            font-size: 11px;
            color: #74b9ff;
            opacity: 0.8;
            font-family: monospace;
        }

        /* Desk Accessories */
        .mobile {
            width: 25px;
            height: 45px;
            background: #111;
            border: 1px solid #555;
            border-radius: 4px;
            transform: rotate(-15deg);
            margin-bottom: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .calendar {
            width: 40px;
            height: 35px;
            background: #fff;
            color: #333;
            border-radius: 4px;
            text-align: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 5px;
            overflow: hidden;
        }

        .calendar-header {
            background: #e74c3c;
            color: white;
            padding: 2px 0;
            font-size: 7px;
        }

        /* Engineer Sitting (Back View) */
        .engineer {
            position: absolute;
            bottom: 20px;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .head {
            width: 50px;
            height: 55px;
            background-color: #4a3728; /* Hair color */
            border-radius: 50% 50% 40% 40%;
            position: relative;
        }

        .headphones {
            position: absolute;
            top: 15px;
            width: 60px;
            height: 12px;
            background-color: #e74c3c;
            border-radius: 10px;
            left: -5px;
        }

        .torso {
            width: 90px;
            height: 70px;
            background-color: var(--accent-glow); /* Hoodie/Shirt */
            border-radius: 20px 20px 0 0;
            margin-top: -5px;
        }

        .chair-back {
            position: absolute;
            bottom: -20px;
            width: 110px;
            height: 90px;
            background-color: #111;
            border-radius: 15px 15px 0 0;
            border: 3px solid #333;
            z-index: -1;
        }

        /* Helper label style */
        .label {
            position: absolute;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="room">
        <div class="ambient-light"></div>

        <!-- LEFT SIDE: Book Rack with Project Files -->
        <div class="book-rack">
            <span class="label" style="top: -25px; left: 0;">Project Files Rack</span>
            <div class="shelf">
                <div class="file-binder file-1">React App</div>
                <div class="file-binder file-2">API Docs</div>
                <div class="file-binder file-3">Design</div>
            </div>
            <div class="shelf">
                <div class="file-binder file-4">Next.js</div>
                <div class="file-binder file-1">Python</div>
            </div>
            <div class="shelf">
                <div class="file-binder file-2">Database</div>
                <div class="file-binder file-3">Client B</div>
                <div class="file-binder file-4">Archive</div>
            </div>
        </div>

        <!-- CENTER: Desk & Engineer -->
        <div class="workspace">
            
            <!-- Devices on Desk -->
            <div class="devices-setup">
                <!-- Mobile Phone -->
                <div class="mobile"></div>

                <!-- Secondary Monitor (Left of Laptop) -->
                <div class="monitor">
                    <span class="screen-glow">&lt;Code /&gt;</span>
                    <div class="monitor-stand"></div>
                </div>

                <!-- Primary Laptop (Facing Away) -->
                <div class="laptop">
                    <div class="laptop-logo"></div>
                </div>

                <!-- Desk Calendar -->
                <div class="calendar">
                    <div class="calendar-header">SEP</div>
                    <div style="padding-top: 3px;">24</div>
                </div>
            </div>

            <!-- Desk Surface -->
            <div class="desk"></div>

            <!-- Engineer Sitting (Back View) -->
            <div class="engineer">
                <div class="head">
                    <div class="headphones"></div>
                </div>
                <div class="torso"></div>
                <div class="chair-back"></div>
            </div>
        </div>

        <!-- RIGHT SIDE: Achievements & Medals Rack -->
        <div class="achievement-rack">
            <div class="rack-title">Achievements</div>
            <div class="medals-container">
                <div class="medal gold">🥇</div>
                <div class="medal silver">🥈</div>
                <div class="medal bronze">🥉</div>
            </div>
            <div class="trophy-shelf">
                <div class="trophy">🏆</div>
                <div class="trophy">🎖️</div>
            </div>
        </div>
    </div>

</body>
</html>
